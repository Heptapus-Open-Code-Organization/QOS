name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test-core:
    name: Test portable crates and verification runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the nightly + rust-src + llvm-tools + the bare-metal/UEFI
      # targets, so rustup installs the right toolchain automatically.
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p qos-abi -p qos-gfx -p qos-ui -p qos-driver -p qos-acpi -p qos-core -p qos-verify -p qos-uaccess --features qos-core/std
      - run: cargo check -p qos-core --no-default-features --target x86_64-unknown-none
      - run: cargo check -p qos-uaccess --target x86_64-unknown-none

  build-kernel:
    name: Build kernel ELF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kernel-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo os-build

  build-image:
    name: Build interactive UEFI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-image-${{ hashFiles('**/Cargo.lock') }}
      # qos-image (artifact dep + bootloader 0.11) compiles the kernel for x86_64-unknown-none
      # and creates the interactive UEFI disk image, copying it into dist/.
      - name: Build disk images
        run: cargo build -p qos-image --release
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: qos-uefi-image
          path: dist/qos-uefi.img
          if-no-files-found: error

  smoke-uefi:
    name: Required UEFI smoke (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cpu: [qemu64, max]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - name: Install QEMU + OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-verify-${{ hashFiles('**/Cargo.lock') }}
      - name: Build verification image and require guest completion
        run: cargo os-verify --cpu ${{ matrix.cpu }}
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qos-uefi-verification-${{ matrix.cpu }}
          path: target/qos-verify/
          if-no-files-found: warn
          retention-days: 7
